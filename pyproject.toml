[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-data-pipeline"
version = "1.0.0"
description = "Pipeline end-to-end para análise de campanhas de marketing digital"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Pedro Neiva", email = "seu.email@exemplo.com"}
]
keywords = ["marketing", "data-pipeline", "analytics", "etl", "dbt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# ============================================
# DEPENDÊNCIAS DE PRODUÇÃO (CORE)
# ============================================
dependencies = [
    # Core Python - Versões compatíveis com Airflow e dbt
    "pandas>=2.0.0,<2.3.0",
    "numpy>=1.24.0,<2.0.0",
    "pyarrow>=14.0.0,<18.0.0",
    
    # Configuração e Validação
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0",
    
    # Google Cloud Platform - Versões estáveis
    "google-cloud-storage>=2.14.0,<3.0.0",
    "google-cloud-bigquery>=3.15.0,<4.0.0",
    "google-analytics-data>=0.18.0,<1.0.0",
    "db-dtypes>=1.1.0,<2.0.0",  # Necessário para BigQuery com pandas
    
    # APIs Externas
    "requests>=2.31.0,<3.0.0",
    "facebook-business>=19.0.0,<20.0.0",
    
    # Logging
    "structlog>=23.2.0,<25.0.0",
    "python-json-logger>=2.0.7,<3.0.0",
]

# ============================================
# DEPENDÊNCIAS OPCIONAIS (EVITA CONFLITOS)
# ============================================
[project.optional-dependencies]

# Airflow - Instalar separadamente ou em ambiente específico
airflow = [
    "apache-airflow>=2.8.0,<2.9.0",
    "apache-airflow-providers-google>=10.12.0,<11.0.0",
]

# DBT - Instalar separadamente ou em ambiente específico  
dbt = [
    "dbt-core>=1.7.0,<1.9.0",
    "dbt-bigquery>=1.7.0,<1.9.0",
]

# Ambiente completo (cuidado com conflitos!)
full = [
    "apache-airflow>=2.8.0,<2.9.0",
    "apache-airflow-providers-google>=10.12.0,<11.0.0",
    "dbt-core>=1.7.0,<1.9.0",
    "dbt-bigquery>=1.7.0,<1.9.0",
]

# Machine Learning
ml = [
    "scikit-learn>=1.3.0,<2.0.0",
    "joblib>=1.3.0,<2.0.0",
    "lightgbm>=4.1.0,<5.0.0",
]

# Desenvolvimento
dev = [
    # Testes
    "pytest>=7.4.0,<9.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "faker>=20.0.0,<27.0.0",
    
    # Qualidade de Código
    "ruff>=0.1.0,<1.0.0",
    "black>=23.0.0,<25.0.0",
    "isort>=5.12.0,<6.0.0",
    "mypy>=1.7.0,<2.0.0",
    
    # Notebooks e Análise
    "ipython>=8.18.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<1.0.0",
    
    # Ferramentas
    "pre-commit>=3.5.0,<4.0.0",
]

# Apenas testes
test = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "faker>=20.0.0,<27.0.0",
]

# Documentação
docs = [
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.4.0,<10.0.0",
]

# ============================================
# SCRIPTS CLI
# ============================================
[project.scripts]
marketing-pipeline = "src.cli:main"
validate-env = "alert.setup.validate_env:main"

# ============================================
# URLs do Projeto
# ============================================
[project.urls]
Homepage = "https://github.com/pedroabn/pipeline_dados/"
Documentation = "https://github.com/pedroabn/pipeline_dados/wiki"
Repository = "https://github.com/pedroabn/pipeline_dados/"
Issues = "https://github.com/pedroabn/pipeline_dados/issues"

# ============================================
# CONFIGURAÇÃO SETUPTOOLS
# ============================================
[tool.setuptools]
packages = ["src", "alert", "config"]

[tool.setuptools.package-data]
src = ["py.typed"]

# ============================================
# PYTEST - Configuração de Testes
# ============================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]
markers = [
    "unit: Testes unitários rápidos",
    "integration: Testes de integração (requerem GCP)",
    "slow: Testes lentos",
]
env = [
    "ENVIRONMENT=test"
]

# ============================================
# COVERAGE - Configuração de Cobertura
# ============================================
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ============================================
# BLACK - Formatação de Código
# ============================================
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
  | airflow/dbt
)/
'''

# ============================================
# ISORT - Organização de Imports
# ============================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/airflow/dbt/*", "*/.venv/*"]

# ============================================
# RUFF - Linter Moderno
# ============================================
[tool.ruff]
line-length = 100
target-version = "py310"

extend-exclude = [
    "airflow/dbt",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]

ignore = [
    "E501",  # line too long (black cuida disso)
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
]

# ============================================
# MYPY - Type Checking
# ============================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

exclude = [
    "airflow/dbt",
    "tests",
    ".venv",
]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true