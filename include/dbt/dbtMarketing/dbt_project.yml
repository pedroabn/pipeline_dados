# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models

name: 'dbtmarketing'
version: '1.0.0'
config-version: 2

# Configuração do profile (profiles.yml)
profile: 'dbtMarketing'

# Diretórios do projeto
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Diretórios de build
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Variáveis do projeto
vars:
  start_date: '2025-01-01'
  project_id: "{{ env_var('GCP_PROJECT_ID') }}"

# Configurações dos models
models:
  dbtMarketing:
    # Bronze - Dados brutos (external tables ou views)
    bronze:
      +materialized: view
      +schema: bronze
      +tags: ['bronze', 'raw']
    
    # Silver - Dados limpos e padronizados
    silver:
      +materialized: table
      +schema: silver
      +tags: ['silver', 'cleaned']
      +partition_by:
        field: data_date
        data_type: date
        granularity: day
    
    # Gold - Dados agregados e métricas de negócio
    gold:
      +materialized: table
      +schema: gold
      +tags: ['gold', 'metrics']
      +partition_by:
        field: data_date
        data_type: date
        granularity: day

# Testes
tests:
  dbtMarketing:
    +store_failures: true
    +schema: dbt_test_failures

# Seeds
seeds:
  dbtMarketing:
    +schema: seeds

# Snapshots
snapshots:
  dbtMarketing:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: updated_at

# Configurações de execução
on-run-start:
  - "{{ log('🚀 Iniciando transformações dbt - ' ~ target.name, info=true) }}"

on-run-end:
  - "{{ log('✅ Transformações concluídas com sucesso!', info=true) }}"